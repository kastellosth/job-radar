<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<style>
  :root { --teal:#119c8f; --ink:#1d2327; --muted:#6b7378; --line:#e3e7e9; --bg:#f7f9fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; }
  h1 { font-size:18px; margin:0; color:var(--teal); }
  header .spacer { flex:1; }
  button { font:inherit; border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
  main { max-width:960px; margin:0 auto; padding:16px 24px 48px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:28px 0 8px; }
  .job { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:8px 0; display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
  .job.NEW { border-left:4px solid var(--teal); }
  .title a { color:var(--ink); font-weight:600; text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .meta, .reasons { color:var(--muted); font-size:13px; }
  .score { font-weight:700; color:var(--teal); text-align:right; }
  .actions { grid-column:1 / -1; display:flex; gap:6px; flex-wrap:wrap; }
  .actions button { font-size:12px; padding:3px 8px; }
  .pill { font-size:11px; padding:1px 6px; border-radius:10px; background:#eef6f5; color:var(--teal); margin-left:6px; }
  .empty { color:var(--muted); font-style:italic; }
  #status { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Job Radar</h1>
  <span id="status"></span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="showApplied" checked> show applied</label>
  <button class="primary" id="refresh">Fetch new jobs now</button>
</header>
<main id="app"></main>

<script>
const LABELS = { STRONG: "Strong match", GOOD: "Good match", STRETCH: "Stretch" };
const app = document.getElementById("app");
const statusEl = document.getElementById("status");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function load() {
  const statuses = ["NEW", "SEEN"];
  if (document.getElementById("showApplied").checked) statuses.push("APPLIED");
  const res = await fetch("/api/jobs?status=" + statuses.join(","));
  const groups = await res.json();
  app.innerHTML = Object.entries(groups).map(([bucket, jobs]) => `
    <h2>${LABELS[bucket] ?? bucket} (${jobs.length})</h2>
    ${jobs.length === 0 ? '<p class="empty">Nothing here yet.</p>' : jobs.map(job => `
      <div class="job ${job.status}">
        <div class="title">
          <a href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.title)}</a>
          ${job.status !== "SEEN" ? `<span class="pill">${job.status}</span>` : ""}
        </div>
        <div class="score">${job.score}</div>
        <div class="meta">${esc(job.company)} · ${job.remote ? "Remote" : esc(job.location ?? "")} · via ${esc(job.source)}</div>
        <div></div>
        <div class="reasons">${esc(job.reasons)}</div>
        <div class="actions">
          ${["SEEN", "APPLIED", "REJECTED", "HIDDEN"].map(s =>
            `<button onclick="setStatus(${job.id}, '${s}')">${s.toLowerCase()}</button>`).join("")}
        </div>
      </div>`).join("")}
  `).join("");
}

async function setStatus(id, status) {
  await fetch(`/api/jobs/${id}/status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status })
  });
  load();
}

document.getElementById("refresh").onclick = async () => {
  statusEl.textContent = "Fetching…";
  const r = await (await fetch("/api/ingest", { method: "POST" })).json();
  statusEl.textContent = `Fetched ${r.fetched}, ${r.inserted} new, ${r.updated} updated`;
  load();
};
document.getElementById("showApplied").onchange = load;
load();
</script>
</body>
</html>
